name: Dev Testing CI

on:
  push:
    branches: [dev-testing]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --network-timeout 600000
          CI=false yarn build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: python -m py_compile backend/server.py backend/inventory_flow.py backend/master_products.py app.py
