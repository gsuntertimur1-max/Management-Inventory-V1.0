name: Dev Testing CI

on:
  push:
    branches: [dev-testing]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --network-timeout 600000
          CI=false yarn build

      - name: Test frontend role permissions
        working-directory: frontend
        run: CI=true yarn test --watchAll=false --runInBand src/lib/permissions.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Validate Python syntax
        run: python -m py_compile backend/server.py backend/role_four_config.py backend/inventory_flow.py backend/master_products.py backend/outbound_flow.py backend/outbound_reservation_view.py backend/outbound_start_guard.py backend/reservation_mutation_guards.py backend/supplier_lifecycle_guards.py backend/document_settlement_guards.py backend/return_lot_tracking.py backend/return_lot_reconciliation.py backend/outbound_completion_hardening.py backend/consignment.py backend/consignment_locations.py backend/consignment_operations.py backend/bazar_packages.py backend/consignment_documents.py backend/marketplace_integration.py backend/marketplace_oauth.py backend/stack_allocations.py backend/stock_transfer.py backend/pdf_documents.py backend/outbound_pdf_multi.py backend/queue_flow.py backend/loading_plan.py backend/operational_guards.py backend/correction_receipts.py backend/qc_receipt_guard.py backend/correction_reversal.py backend/correction_outbound.py backend/operational_corrections.py backend/integrity_control.py backend/integrity_lots.py backend/integrity_postcommit.py backend/integrity_documents.py backend/stock_opname.py backend/opname_lots.py backend/opname_lots_conservative.py backend/opname_lot_atomic.py backend/opname_reconcile_guard.py backend/stack_lots.py backend/stack_reservations.py backend/fefo_conservative.py backend/fefo_atomic.py backend/fefo_selection.py backend/fefo_flow.py backend/lot_corrections.py backend/damaged_stock_area.py backend/damaged_outbound.py backend/cost_payments.py app.py

      - name: Run backend safety tests
        run: pytest -q backend/tests/test_four_roles.py backend/tests/test_unit_safety.py backend/tests/test_operational_guards.py backend/tests/test_corrections.py backend/tests/test_operational_corrections_routes.py backend/tests/test_integrity_control.py backend/tests/test_integrity_documents.py backend/tests/test_loading_plan.py backend/tests/test_outbound_pdf_multi.py backend/tests/test_stock_opname.py backend/tests/test_stack_lots.py backend/tests/test_subledgers.py backend/tests/test_stack_reservations_core.py backend/tests/test_stock_transfer.py backend/tests/test_consignment_operations.py backend/tests/test_marketplace_integration.py backend/tests/test_location_master.py backend/tests/test_cost_payments.py backend/tests/test_consignment_documents.py
