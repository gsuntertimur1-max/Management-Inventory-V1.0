name: Check Production Alias

on:
  push:
    branches: [main]
    paths:
      - .vercel-alias-check-trigger

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check stable production URL
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://management-inventory-v1-0-gsuntertimur1-5309.vercel.app"
          FRONT=$(curl -sS -L -o /tmp/front -w "%{http_code}|%{url_effective}" "$BASE/" || true)
          API=$(curl -sS -L -o /tmp/api -w "%{http_code}|%{url_effective}" "$BASE/api/" || true)
          echo "FRONT=$FRONT"
          echo "API=$API"
          echo "API_BODY=$(head -c 500 /tmp/api || true)"
          echo "FRONT_TITLE=$(grep -o '<title>[^<]*' /tmp/front | head -1 || true)"
          if echo "$FRONT" | grep -q '^200|' && echo "$API" | grep -q '^200|' && grep -q 'Bulog Gudang API' /tmp/api; then
            echo "ALIAS_OK"
            exit 0
          fi
          echo "ALIAS_NOT_READY"
          exit 1
