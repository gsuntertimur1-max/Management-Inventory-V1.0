name: Dev Testing CI

on:
  push:
    branches: [dev-testing]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --network-timeout 600000
          CI=false yarn build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Validate Python syntax
        run: python -m py_compile backend/server.py backend/inventory_flow.py backend/master_products.py backend/outbound_flow.py backend/consignment.py backend/stack_allocations.py backend/pdf_documents.py backend/operational_guards.py backend/correction_receipts.py backend/correction_reversal.py backend/correction_outbound.py backend/operational_corrections.py backend/integrity_control.py backend/integrity_lots.py backend/stock_opname.py backend/opname_lots.py backend/stack_lots.py backend/fefo_flow.py backend/lot_corrections.py backend/damaged_stock_area.py app.py

      - name: Run backend safety tests
        run: pytest -q backend/tests/test_unit_safety.py backend/tests/test_operational_guards.py backend/tests/test_corrections.py backend/tests/test_operational_corrections_routes.py backend/tests/test_integrity_control.py backend/tests/test_stock_opname.py backend/tests/test_stack_lots.py backend/tests/test_subledgers.py
