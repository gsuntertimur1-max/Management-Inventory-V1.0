name: Build Single Vercel Bundle

on:
  push:
    branches: [main]
    paths:
      - .vercel-single-trigger

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/package.json

      - name: Build React frontend
        working-directory: frontend
        run: |
          yarn install --network-timeout 600000
          CI=false yarn build

      - name: Create deployment bundle
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path

          include_files = [
              Path("app.py"),
              Path("requirements.txt"),
              Path("backend/server.py"),
              Path("backend/seed_data.csv"),
          ]

          build_dir = Path("frontend/build")
          include_files.extend(sorted(p for p in build_dir.rglob("*") if p.is_file()))

          files = []
          for p in include_files:
              raw = p.read_bytes()
              try:
                  data = raw.decode("utf-8")
                  files.append({"file": p.as_posix(), "data": data})
              except UnicodeDecodeError:
                  files.append({
                      "file": p.as_posix(),
                      "data": base64.b64encode(raw).decode("ascii"),
                      "encoding": "base64"
                  })

          Path("vercel_single_bundle.json").write_text(
              json.dumps(files, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )
          print(f"Bundled {len(files)} files")
          PY

      - name: Commit deployment bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel_single_bundle.json
          git diff --cached --quiet || git commit -m "chore: build single Vercel deployment bundle"
          git push
