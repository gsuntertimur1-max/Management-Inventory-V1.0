name: Vercel Smoke Test

on:
  push:
    branches: [main]
    paths:
      - .vercel-smoke-trigger

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test frontend and API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://management-inventory-v1-r7etvk5qf-gsuntertimur1-5309.vercel.app"
          ok=0
          for i in $(seq 1 18); do
            echo "Attempt $i"
            FRONT=$(curl -L -sS -o /tmp/front.txt -w "%{http_code}" "$BASE/" || true)
            API=$(curl -L -sS -o /tmp/api.txt -w "%{http_code}" "$BASE/api/" || true)
            echo "Frontend HTTP: $FRONT"
            echo "API HTTP: $API"
            echo "API body:"
            cat /tmp/api.txt || true
            echo
            if [ "$FRONT" = "200" ] && [ "$API" = "200" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
