name: Temporary Vercel Bundle
on:
  push:
    branches: [main]
    paths:
      - .vercel-rebundle-trigger
jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          skip={".git",".github",".emergent","memory","test_reports"}
          out=[]
          for p in sorted(Path(".").rglob("*")):
            if not p.is_file(): continue
            rel=p.as_posix()
            if rel in {"vercel_bundle.json",".vercel-rebundle-trigger"}: continue
            if rel.split("/",1)[0] in skip: continue
            try: data=p.read_text(encoding="utf-8")
            except UnicodeDecodeError: continue
            out.append({"file":rel,"data":data})
          Path("vercel_bundle.json").write_text(json.dumps(out,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print(len(out))
          PY
      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel_bundle.json
          git diff --cached --quiet || git commit -m "chore: refresh Vercel bundle"
          git push
