name: Prepare Vercel Bundle

on:
  push:
    branches: [main]
    paths-ignore:
      - vercel_bundle.json
      - .github/workflows/vercel-bundle.yml

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          skip_top = {".git", ".github", ".emergent", "memory", "test_reports"}
          files = []
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              rel = p.as_posix()
              if rel == "vercel_bundle.json":
                  continue
              if rel.split("/", 1)[0] in skip_top:
                  continue
              try:
                  data = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              files.append({"file": rel, "data": data})

          Path("vercel_bundle.json").write_text(
              json.dumps(files, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8"
          )
          print(f"Bundled {len(files)} files")
          PY
      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel_bundle.json
          git diff --cached --quiet || git commit -m "chore: prepare Vercel deployment bundle"
          git push
