              'backend/tests/test_unit_safety.py',
              'from backend.outbound_flow import loading_units_from_items\nfrom fastapi import HTTPException',
              'from backend.outbound_flow import loading_units_from_items, _linked_totals, _source_product_totals, _all_source_documents_settled\nfrom backend.stack_allocations import _parse_treatment_date\nfrom fastapi import HTTPException',
          )
          p = Path('backend/tests/test_unit_safety.py')
          text = p.read_text(encoding='utf-8')
          text += '''\n\ndef test_linked_documents_are_scoped_to_source_document():\n    load = {\n        "ref": "ND/001",\n        "documents": ["ND/001", "ND/002"],\n        "items": [\n            {"productId": "p1", "documentNo": "ND/001", "qty": 10, "name": "Minyak"},\n            {"productId": "p1", "documentNo": "ND/002", "qty": 20, "name": "Minyak"},\n        ],\n        "document_links": [\n            {"type": "SO", "sourceDocumentNo": "ND/001", "items": [{"productId": "p1", "qty": 4}]},\n            {"type": "SO", "sourceDocumentNo": "ND/002", "items": [{"productId": "p1", "qty": 7}]},\n        ],\n    }\n    assert _linked_totals(load, "p1", "ND/001") == (0.0, 4.0)\n    assert _linked_totals(load, "p1", "ND/002") == (0.0, 7.0)\n    assert _source_product_totals(load, "ND/001")["p1"]["qty"] == 10\n    assert _all_source_documents_settled(load) is False\n\n\ndef test_treatment_date_parser_rejects_invalid_dates():\n    assert _parse_treatment_date("2026-09-16", "Tanggal").isoformat() == "2026-09-16"\n    with pytest.raises(HTTPException, match="YYYY-MM-DD"):\n        _parse_treatment_date("16/09/2026", "Tanggal")\n'''
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install backend dependencies and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m py_compile backend/server.py backend/inventory_flow.py backend/master_products.py backend/outbound_flow.py backend/consignment.py backend/stack_allocations.py backend/pdf_documents.py app.py
          pytest -q backend/tests/test_unit_safety.py

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --network-timeout 600000
          CI=false yarn build

      - name: Commit remaining hardening
        shell: bash
        run: |
          git config user.name "inventory-audit-bot"
          git config user.email "inventory-audit-bot@users.noreply.github.com"
          rm -f frontend/yarn.lock
          git add backend/consignment.py backend/outbound_flow.py backend/stack_allocations.py backend/pdf_documents.py backend/tests/test_unit_safety.py frontend/src/context/DataContext.js frontend/src/pages/DaftarProduk.jsx frontend/src/pages/Dashboard.jsx frontend/src/pages/Pengeluaran.jsx
          git diff --cached --check
          git commit -m "fix: scope consignment units treatments and refreshes"
          git push origin HEAD:dev-testing
