name: Dev Testing CI

on:
  push:
    branches: [dev-testing]
    paths:
      - '.github/workflows/dev-testing-ci.yml'

permissions:
  contents: write

jobs:
  apply-remaining-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-testing
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply correctness and unit fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement, flags=re.S):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern[:120]}')
              p.write_text(updated, encoding='utf-8')

          def one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one literal match, found {text.count(old)}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Consignment balance is source-document scoped.
          sub('backend/consignment.py', r'def _settled_qty\(load: dict, product_id: str\) -> float:.*?(?=async def consignment_stock)', '''def _source_document(load: dict, item: dict) -> str:\n    return str(item.get("documentNo") or load.get("ref") or "").strip()\n\n\ndef _settled_qty(load: dict, product_id: str, source_document_no: str = "") -> float:\n    target = str(source_document_no or load.get("ref") or "").strip()\n    settled = 0.0\n    for link in load.get("document_links", []):\n        link_source = str(link.get("sourceDocumentNo") or load.get("ref") or "").strip()\n        if target and link_source != target:\n            continue\n        for item in link.get("items", []):\n            if item.get("productId") != product_id:\n                continue\n            if link.get("type") in {"CR", "RETUR"}:\n                settled += float(item.get("goodQty", 0) or 0) + float(item.get("damagedQty", 0) or 0)\n            elif link.get("type") == "SO":\n                settled += float(item.get("qty", 0) or 0)\n    return settled\n\n\n''')
          sub('backend/consignment.py', r'async def consignment_stock\(destination: str = ""\) -> list\[dict\]:.*?(?=@router\.get\("/consignment-stock"\))', '''async def consignment_stock(destination: str = "") -> list[dict]:\n    query = {"document_type": {"$in": ["MEMO", "ND"]}, "status": "Selesai", "consignment_destination": {"$in": list(DESTINATIONS)}}\n    if destination:\n        if destination not in DESTINATIONS:\n            raise HTTPException(status_code=400, detail="Lokasi konsinyasi tidak valid")\n        query["consignment_destination"] = destination\n    loads = await db.outbound_loads.find(query, {"_id": 0}).to_list(5000)\n    result: dict[tuple[str, str, str], dict] = {}\n    for load in loads:\n        source_rows: dict[tuple[str, str, str], dict] = {}\n        for item in load.get("items", []):\n            product_id = item.get("productId", "")\n            if not product_id:\n                continue\n            source_document = _source_document(load, item)\n            channel = normalize_channel(item.get("channel"), "KOM")\n            source_key = (source_document, product_id, channel)\n            row = source_rows.setdefault(source_key, {**item, "qty": 0.0})\n            row["qty"] += float(item.get("qty", 0) or 0)\n        for (source_document, product_id, channel), item in source_rows.items():\n            qty = max(float(item.get("qty", 0) or 0) - _settled_qty(load, product_id, source_document), 0)\n            if qty <= 0:\n                continue\n            key = (load.get("consignment_destination", ""), product_id, channel)\n            row = result.setdefault(key, {\n                "destination": key[0], "productId": product_id, "channel": channel, "sku": item.get("sku", ""),\n                "name": item.get("name", ""), "unit": item.get("unit", ""), "weight": float(item.get("weight", 0) or 0),\n                "measureUnit": item.get("measureUnit", "kg") or "kg", "secondary": item.get("secondary", ""),\n                "secondaryQty": float(item.get("secondaryQty", 0) or 0), "qty": 0.0, "totalWeight": 0.0,\n                "documents": [], "requestDocuments": [],\n            })\n            row["qty"] += qty\n            row["totalWeight"] += qty * float(item.get("weight", 0) or 0)\n            if source_document and source_document not in row["documents"]:\n                row["documents"].append(source_document)\n            if load.get("request_document") and load["request_document"] not in row["requestDocuments"]:\n                row["requestDocuments"].append(load["request_document"])\n    return sorted(result.values(), key=lambda row: (row["destination"] != "Gudang Bazar", row["name"].lower(), row["channel"], row["sku"]))\n\n\n''')
          p = Path('backend/consignment.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('"damaged": damaged, "weight": weight, "totalWeight": qty * weight,', '"damaged": damaged, "weight": weight, "measureUnit": product.get("measureUnit", "kg") or "kg", "totalWeight": qty * weight,')
          text = text.replace('"damaged": 0.0, "weight": float(item.get("weight", 0) or 0), "totalWeight": float(item.get("totalWeight", 0) or 0),', '"damaged": 0.0, "weight": float(item.get("weight", 0) or 0), "measureUnit": item.get("measureUnit", "kg") or "kg", "totalWeight": float(item.get("totalWeight", 0) or 0),')
          text = text.replace('"Kuantum Berat (kg)"', '"Kuantum Fisik"')
          text = text.replace('row["totalWeight"], row["damaged"]', 'f"{row[\"totalWeight\"]:g} {row.get(\"measureUnit\", \"kg\")}", row["damaged"]')
          p.write_text(text, encoding='utf-8')

          # Multi-document CR/Retur/SO must point to exactly one source document.
          one('backend/outbound_flow.py', 'class ConsignmentReturnInput(BaseModel):\n    documentNo: str\n    items: List[ReturnItemInput] = Field(min_length=1)', 'class ConsignmentReturnInput(BaseModel):\n    documentNo: str\n    sourceDocumentNo: str = ""\n    items: List[ReturnItemInput] = Field(min_length=1)')
          one('backend/outbound_flow.py', 'class SettlementInput(BaseModel):\n    documentNo: str\n    items: List[SettlementItemInput] = Field(min_length=1)', 'class SettlementInput(BaseModel):\n    documentNo: str\n    sourceDocumentNo: str = ""\n    items: List[SettlementItemInput] = Field(min_length=1)')
          sub('backend/outbound_flow.py', r'def _linked_totals\(load: dict, product_id: str\) -> tuple\[float, float\]:.*?(?=@router\.post\("/outbound-loads/\{load_id\}/return"\))', '''def _item_source_document(load: dict, item: dict) -> str:\n    return str(item.get("documentNo") or load.get("ref") or "").strip()\n\n\ndef _source_product_totals(load: dict, source_document_no: str) -> dict[str, dict]:\n    rows: dict[str, dict] = {}\n    for item in load.get("items", []):\n        if _item_source_document(load, item) != source_document_no:\n            continue\n        product_id = item.get("productId", "")\n        if not product_id:\n            continue\n        row = rows.setdefault(product_id, {**item, "qty": 0.0, "documentNo": source_document_no})\n        row["qty"] += float(item.get("qty", 0) or 0)\n    return rows\n\n\ndef _resolve_source_document(load: dict, requested: str = "") -> str:\n    documents = [str(value or "").strip() for value in (load.get("documents") or [load.get("ref", "")]) if str(value or "").strip()]\n    source = str(requested or "").strip()\n    if not source:\n        if len(documents) > 1:\n            raise HTTPException(status_code=400, detail="Pilih satu dokumen sumber ND/Memo/CT terlebih dahulu")\n        source = documents[0] if documents else str(load.get("ref") or "").strip()\n    if source not in documents:\n        raise HTTPException(status_code=400, detail="Dokumen sumber tidak terdapat pada pengeluaran ini")\n    return source\n\n\ndef _linked_totals(load: dict, product_id: str, source_document_no: str = "") -> tuple[float, float]:\n    target = str(source_document_no or load.get("ref") or "").strip()\n    returned = sold = 0.0\n    for link in load.get("document_links", []):\n        link_source = str(link.get("sourceDocumentNo") or load.get("ref") or "").strip()\n        if target and link_source != target:\n            continue\n        for item in link.get("items", []):\n            if item.get("productId") != product_id:\n                continue\n            if link.get("type") in {"CR", "RETUR"}:\n                returned += float(item.get("goodQty", 0) or 0) + float(item.get("damagedQty", 0) or 0)\n            elif link.get("type") == "SO":\n                sold += float(item.get("qty", 0) or 0)\n    return returned, sold\n\n\ndef _all_source_documents_settled(load: dict) -> bool:\n    documents = []\n    for item in load.get("items", []):\n        source = _item_source_document(load, item)\n        if source and source not in documents:\n            documents.append(source)\n    for source_document in documents:\n        for product_id, source in _source_product_totals(load, source_document).items():\n            returned, sold = _linked_totals(load, product_id, source_document)\n            if returned + sold + 1e-9 < float(source.get("qty", 0) or 0):\n                return False\n    return True\n\n\n''')
          sub('backend/outbound_flow.py', r'@router\.post\("/outbound-loads/\{load_id\}/return"\)\nasync def create_consignment_return.*?(?=\ndef _sales_returned_qty)', '''@router.post("/outbound-loads/{load_id}/return")\nasync def create_consignment_return(load_id: str, body: ConsignmentReturnInput, user: dict = Depends(require_write)):\n    load = await db.outbound_loads.find_one({"id": load_id}, {"_id": 0})\n    if not load or load.get("document_type") not in {"CT", "MEMO", "ND"} or load.get("status") != "Selesai":\n        raise HTTPException(status_code=400, detail="Pengembalian hanya dapat dibuat dari CT, Memo, atau ND yang sudah selesai dimuat")\n    expected_return = "CR" if load.get("document_type") == "CT" else "RETUR"\n    if body.returnType != expected_return:\n        raise HTTPException(status_code=400, detail=f"Dokumen {load.get('document_type')} harus menggunakan {expected_return}")\n    document_no = body.documentNo.strip()\n    valid_prefix = ("CR",) if body.returnType == "CR" else ("RT", "RET", "RM")\n    if not document_no.upper().startswith(valid_prefix):\n        raise HTTPException(status_code=400, detail=f"Nomor pengembalian harus berupa dokumen {body.returnType}")\n    if await db.outbound_loads.find_one({"$or": [{"ref": document_no}, {"document_links.no": document_no}]}):\n        raise HTTPException(status_code=409, detail="Nomor dokumen pengembalian sudah digunakan")\n    if len({item.productId for item in body.items}) != len(body.items):\n        raise HTTPException(status_code=400, detail="Produk retur tidak boleh dicatat lebih dari satu baris")\n    source_document = _resolve_source_document(load, body.sourceDocumentNo)\n    original = _source_product_totals(load, source_document)\n    if not original:\n        raise HTTPException(status_code=400, detail="Dokumen sumber tidak memiliki komoditas yang dapat diselesaikan")\n    link_items, stock_changes, stack_changes = [], [], []\n    link_applied = False\n    try:\n        for item in body.items:\n            source = original.get(item.productId)\n            if not source:\n                raise HTTPException(status_code=400, detail="Produk retur tidak terdapat pada dokumen sumber yang dipilih")\n            placements = [placement for placement in item.placements if float(placement.goodQty) > 0] or ([ReturnPlacementInput(goodQty=item.goodQty, stackCode=item.stackCode)] if item.goodQty else [])\n            good_qty = sum(float(placement.goodQty) for placement in placements)\n            qty = good_qty + float(item.damagedQty)\n            if qty <= 0:\n                continue\n            returned, sold = _linked_totals(load, item.productId, source_document)\n            if qty > float(source.get("qty", 0) or 0) - returned - sold + 1e-9:\n                raise HTTPException(status_code=400, detail=f"Jumlah retur {source.get('name', '')} melebihi sisa dokumen sumber")\n            product = await db.products.find_one({"id": item.productId}, {"_id": 0})\n            if not product:\n                raise HTTPException(status_code=404, detail="Produk pengembalian tidak ditemukan")\n            channel = normalize_channel(source.get("channel"), normalize_channel(product.get("channel")))\n            await ensure_channel_stock(product)\n            if good_qty:\n                for placement in placements:\n                    if placement.stackCode.strip().upper() not in await valid_stack_codes():\n                        raise HTTPException(status_code=400, detail=f"Pilih lokasi tumpukan untuk barang Good {source.get('name', '')}")\n                await db.products.update_one({"id": item.productId}, {"$inc": {"stock": good_qty, f"channelStock.{channel}.stock": good_qty}})\n                stock_changes.append((item.productId, "stock", good_qty, channel))\n                for placement in placements:\n                    await allocate_stock_to_stack(product, placement.stackCode, float(placement.goodQty), user.get("name", ""))\n                    stack_changes.append((item.productId, placement.stackCode.strip().upper(), float(placement.goodQty)))\n            if item.damagedQty:\n                await db.products.update_one({"id": item.productId}, {"$inc": {"damaged": float(item.damagedQty), f"channelStock.{channel}.damaged": float(item.damagedQty)}})\n                stock_changes.append((item.productId, "damaged", float(item.damagedQty), channel))\n            link_items.append({"productId": item.productId, "name": source.get("name", ""), "unit": source.get("unit", ""), "channel": channel, "goodQty": good_qty, "damagedQty": float(item.damagedQty), "stackCode": placements[0].stackCode.strip().upper() if len(placements) == 1 else "", "placements": [{"goodQty": float(placement.goodQty), "stackCode": placement.stackCode.strip().upper()} for placement in placements]})\n        if not link_items:\n            raise HTTPException(status_code=400, detail="Isi jumlah barang yang dikembalikan")\n        link = {"id": new_id(), "type": body.returnType, "no": document_no, "sourceDocumentNo": source_document, "time": now_iso(), "items": link_items, "note": body.note.strip(), "operator": user.get("name", "")}\n        prospective = {**load, "document_links": [*load.get("document_links", []), link]}\n        status = "Selesai Dokumen" if _all_source_documents_settled(prospective) else f"{body.returnType} Tercatat · Menunggu SO"\n        await db.outbound_loads.update_one({"id": load_id}, {"$push": {"document_links": link}, "$set": {"document_status": status}})\n        link_applied = True\n        await db.transactions.insert_many([{"id": new_id(), "load_id": load_id, "time": link["time"], "ref": document_no, "type": "MASUK", "kondisi": "PENGEMBALIAN", "document_type": body.returnType, "parent_document": source_document, "product": x["name"], "change": x["goodQty"] + x["damagedQty"], "good_change": x["goodQty"], "damaged_change": x["damagedQty"], "unit": x["unit"], "channel": x["channel"], "penerima": load.get("party", ""), "operator": user.get("name", ""), "keterangan": body.note.strip()} for x in link_items])\n        return link\n    except Exception:\n        await db.transactions.delete_many({"load_id": load_id, "ref": document_no, "document_type": body.returnType})\n        if link_applied:\n            await db.outbound_loads.update_one({"id": load_id}, {"$pull": {"document_links": {"id": link["id"]}}, "$set": {"document_status": load.get("document_status", "Selesai")}})\n        for product_id, stack_code, qty in reversed(stack_changes):\n            try:\n                await decrease_stack_allocation(product_id, stack_code, qty, "Sistem (rollback retur)")\n            except Exception:\n                pass\n        for product_id, field, qty, channel in reversed(stock_changes):\n            await db.products.update_one({"id": product_id}, {"$inc": {field: -qty, f"channelStock.{channel}.{field}": -qty}})\n        raise\n\n''')
          sub('backend/outbound_flow.py', r'@router\.post\("/outbound-loads/\{load_id\}/settle"\)\nasync def settle_outbound_document.*\Z', '''@router.post("/outbound-loads/{load_id}/settle")\nasync def settle_outbound_document(load_id: str, body: SettlementInput, user: dict = Depends(require_write)):\n    load = await db.outbound_loads.find_one({"id": load_id}, {"_id": 0})\n    if not load or load.get("document_type") not in {"CT", "MEMO", "ND"} or load.get("status") != "Selesai":\n        raise HTTPException(status_code=400, detail="SO lanjutan hanya dapat dibuat dari CT, Memo, atau ND yang selesai")\n    document_no = body.documentNo.strip()\n    if not document_no.upper().startswith("SO/"):\n        raise HTTPException(status_code=400, detail="Nomor penyelesaian harus berupa dokumen SO")\n    if await db.outbound_loads.find_one({"$or": [{"ref": document_no}, {"document_links.no": document_no}]}):\n        raise HTTPException(status_code=409, detail="Nomor SO sudah digunakan")\n    if len({item.productId for item in body.items}) != len(body.items):\n        raise HTTPException(status_code=400, detail="Produk SO tidak boleh dicatat lebih dari satu baris")\n    source_document = _resolve_source_document(load, body.sourceDocumentNo)\n    original = _source_product_totals(load, source_document)\n    if not original:\n        raise HTTPException(status_code=400, detail="Dokumen sumber tidak memiliki komoditas yang dapat diselesaikan")\n    items = []\n    for item in body.items:\n        source = original.get(item.productId)\n        if not source:\n            raise HTTPException(status_code=400, detail="Produk SO tidak terdapat pada dokumen sumber yang dipilih")\n        returned, sold = _linked_totals(load, item.productId, source_document)\n        if float(item.qty) > float(source.get("qty", 0) or 0) - returned - sold + 1e-9:\n            raise HTTPException(status_code=400, detail=f"Jumlah SO {source.get('name', '')} melebihi sisa dokumen sumber")\n        items.append({"productId": item.productId, "name": source.get("name", ""), "unit": source.get("unit", ""), "channel": source.get("channel", ""), "qty": float(item.qty)})\n    link = {"id": new_id(), "type": "SO", "no": document_no, "sourceDocumentNo": source_document, "time": now_iso(), "items": items, "note": body.note.strip(), "operator": user.get("name", "")}\n    prospective = {**load, "document_links": [*load.get("document_links", []), link]}\n    try:\n        await db.outbound_loads.update_one({"id": load_id}, {"$push": {"document_links": link}, "$set": {"document_status": "Selesai Dokumen" if _all_source_documents_settled(prospective) else "SO Sebagian · Belum Selesai"}})\n        await db.transactions.insert_many([{"id": new_id(), "load_id": load_id, "time": link["time"], "ref": document_no, "type": "DOKUMEN", "kondisi": "—", "document_type": "SO", "parent_document": source_document, "product": item["name"], "change": 0, "settled_qty": item["qty"], "unit": item["unit"], "channel": item.get("channel", ""), "penerima": load.get("party", ""), "operator": user.get("name", ""), "keterangan": body.note.strip()} for item in items])\n        return link\n    except Exception:\n        await db.transactions.delete_many({"load_id": load_id, "ref": document_no, "document_type": "SO"})\n        await db.outbound_loads.update_one({"id": load_id}, {"$pull": {"document_links": {"id": link["id"]}}, "$set": {"document_status": load.get("document_status", "Selesai")}})\n        raise\n''')

          # Treatment validation and measureUnit on manual stack allocation.
          one('backend/stack_allocations.py', 'import re\nfrom typing', 'import re\nfrom datetime import datetime\nfrom typing')
          one('backend/stack_allocations.py', '"weight": float(product.get("weight", 0) or 0),\n        "secondary": secondary,', '"weight": float(product.get("weight", 0) or 0),\n        "measureUnit": product.get("measureUnit", "kg") or "kg",\n        "secondary": secondary,')
          one('backend/stack_allocations.py', 'class StackTreatmentBody(BaseModel):\n    type: Literal["SPRAYING", "FUMIGASI", "FUMIGASI_SULFUR"]\n    warehouse: str\n    stackCode: str = ""\n    startDate: str\n    endDate: str = ""\n    note: str = ""\n', 'class StackTreatmentBody(BaseModel):\n    type: Literal["SPRAYING", "FUMIGASI", "FUMIGASI_SULFUR"]\n    warehouse: str\n    stackCode: str = ""\n    startDate: str\n    endDate: str = ""\n    note: str = ""\n\n\ndef _parse_treatment_date(value: str, label: str):\n    text = str(value or "").strip()\n    if not text:\n        raise HTTPException(status_code=400, detail=f"{label} wajib diisi")\n    try:\n        return datetime.strptime(text, "%Y-%m-%d").date()\n    except ValueError as exc:\n        raise HTTPException(status_code=400, detail=f"{label} harus berformat YYYY-MM-DD") from exc\n')
          sub('backend/stack_allocations.py', r'@router\.post\("/stack-treatments"\)\nasync def create_stack_treatment.*?(?=\n\n@router\.get\("/export/stack-card\.xlsx"\))', '''@router.post("/stack-treatments")\nasync def create_stack_treatment(body: StackTreatmentBody, user: dict = Depends(require_write)):\n    warehouse = body.warehouse.strip().upper()\n    stack_code = body.stackCode.strip().upper()\n    valid_codes = await valid_stack_codes()\n    if warehouse not in {code.split("/", 1)[0] for code in valid_codes}:\n        raise HTTPException(status_code=400, detail="GBB tidak valid")\n    start = _parse_treatment_date(body.startDate, "Tanggal pelaksanaan")\n    end = None\n    products = []\n    standard_days = 0\n    if body.type != "SPRAYING":\n        end = _parse_treatment_date(body.endDate, "Tanggal buka sungkup")\n        if end < start:\n            raise HTTPException(status_code=400, detail="Tanggal buka sungkup tidak boleh lebih awal dari tanggal mulai")\n        if stack_code not in valid_codes:\n            raise HTTPException(status_code=400, detail="Pilih tumpukan untuk fumigasi")\n        if stack_code.split("/", 1)[0] != warehouse:\n            raise HTTPException(status_code=400, detail="Tumpukan fumigasi harus berada pada GBB yang dipilih")\n        allocations = await db.stack_allocations.find({"stackCode": stack_code}, {"_id": 0}).to_list(1000)\n        products = [{"productId": x.get("productId"), "name": x.get("productName"), "qty": x.get("primaryQty"), "unit": x.get("unit")} for x in allocations if "BERAS" in str(x.get("productName", "")).upper()]\n        if not products:\n            raise HTTPException(status_code=400, detail="Fumigasi hanya dapat dicatat pada tumpukan yang berisi beras")\n        standard_days = 3 if body.type == "FUMIGASI_SULFUR" else 10\n    else:\n        stack_code = ""\n    normalized_start = start.isoformat()\n    normalized_end = end.isoformat() if end else ""\n    if await db.stack_treatments.find_one({"type": body.type, "warehouse": warehouse, "stackCode": stack_code, "startDate": normalized_start}, {"_id": 1}):\n        raise HTTPException(status_code=409, detail="Catatan pengendalian hama pada tanggal dan lokasi tersebut sudah ada")\n    doc = body.model_dump()\n    doc.update({"id": new_id(), "warehouse": warehouse, "stackCode": stack_code, "startDate": normalized_start, "endDate": normalized_end, "durationDays": (end - start).days if end else 0, "standardDurationDays": standard_days, "products": products, "createdAt": now_iso(), "operator": user.get("name", "")})\n    await db.stack_treatments.insert_one(dict(doc))\n    return doc\n''')
          p = Path('backend/stack_allocations.py')
          text = p.read_text(encoding='utf-8').replace('"Berat (kg)"', '"Kuantum Fisik"')
          text = text.replace('item.get("unit", ""), float(item.get("primaryQty", 0) or 0) * float(item.get("weight", 0) or 0)])', 'item.get("unit", ""), f"{float(item.get(\"primaryQty\", 0) or 0) * float(item.get(\"weight\", 0) or 0):g} {item.get(\"measureUnit\", \"kg\")}"])')
          p.write_text(text, encoding='utf-8')

          # PDF unit labels. Replace all relevant physical quantity occurrences;
          # weighing forms remain BRUTO (KG) because those are scale readings.
          p = Path('backend/pdf_documents.py')
          text = p.read_text(encoding='utf-8')
          if 'def _measure_unit(item: dict)' not in text:
              text = text.replace('def _date(value, with_time=False) -> str:', 'def _measure_unit(item: dict) -> str:\n    unit = str(item.get("measureUnit") or "kg").strip().lower()\n    return unit if unit in {"kg", "liter", "pcs"} else "kg"\n\n\ndef _date(value, with_time=False) -> str:', 1)
          text = text.replace('"KUANTUM BERAT"', '"KUANTUM FISIK"').replace('"BERAT / UNIT"', '"KUANTUM / UNIT"')
          text = text.replace('f"{_num(item.get(\'totalWeight\', 0))} kg" if item.get("weight") else "-"', 'f"{_num(item.get(\'totalWeight\', 0))} {_measure_unit(item)}" if item.get("weight") else "-"')
          text = text.replace('f"{_num(item.get(\'weight\', 0))} kg" if item.get("weight") else "-"', 'f"{_num(item.get(\'weight\', 0))} {_measure_unit(item)}" if item.get("weight") else "-"')
          text = text.replace('_num(float(item.get("primaryQty",0) or 0)*float(item.get("weight",0) or 0)),_num(item.get("secondaryCount",0))', 'f"{_num(float(item.get(\"primaryQty\",0) or 0)*float(item.get(\"weight\",0) or 0))} {_measure_unit(item)}",_num(item.get("secondaryCount",0))')
          p.write_text(text, encoding='utf-8')

          # Product and dashboard unit display.
          p = Path('frontend/src/pages/DaftarProduk.jsx')
          text = p.read_text(encoding='utf-8').replace('{formatNum(totalWeight(p.stock, p))} kg', "{formatNum(totalWeight(p.stock, p))} {p.measureUnit || 'kg'}")
          p.write_text(text, encoding='utf-8')

          sub('frontend/src/pages/Dashboard.jsx', r'  const remainingDocumentItems = \(load\) => .*?\.filter\(\(item\) => item\.remaining > 0\);', '''  const sourceDocumentFor = (load, item) => item.documentNo || load.ref || '';\n  const linkedUsageFor = (load, sourceDocumentNo, productId) => (load.document_links || []).reduce((total, link) => {\n    const linkSource = link.sourceDocumentNo || load.ref || '';\n    if (linkSource !== sourceDocumentNo) return total;\n    return total + (link.items || []).filter((item) => item.productId === productId).reduce((sum, item) => sum + (['CR', 'RETUR'].includes(link.type) ? Number(item.goodQty || 0) + Number(item.damagedQty || 0) : Number(item.qty || 0)), 0);\n  }, 0);\n  const remainingDocumentItems = (load) => {\n    const grouped = {};\n    (load.items || []).forEach((source) => {\n      const sourceDocumentNo = sourceDocumentFor(load, source);\n      const key = `${sourceDocumentNo}|${source.productId}`;\n      grouped[key] = grouped[key] || { ...source, qty: 0, documentNo: sourceDocumentNo };\n      grouped[key].qty += Number(source.qty || 0);\n    });\n    return Object.values(grouped).map((source) => ({ ...source, remaining: Math.max(Number(source.qty || 0) - linkedUsageFor(load, source.documentNo, source.productId), 0) })).filter((item) => item.remaining > 0);\n  };''')
          p = Path('frontend/src/pages/Dashboard.jsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('CT / Memo Belum Diselesaikan', 'CT / Memo / ND Belum Diselesaikan')
          text = text.replace('<div key={item.productId}>{item.name} · <span className="font-mono font-semibold">', '<div key={`${item.documentNo}-${item.productId}`}>{item.documentNo && <span className="text-[#6b7688]">{item.documentNo} · </span>}{item.name} · <span className="font-mono font-semibold">')
          text = text.replace("['Saluran', 'Lokasi', 'SKU', 'Nama Komoditi', 'Kuantum Pack/PCS', 'Berat', 'Rusak']", "['Saluran', 'Lokasi', 'SKU', 'Nama Komoditi', 'Kuantum Pack/PCS', 'Kuantum Fisik', 'Rusak']")
          text = text.replace('`${formatNum(p.totalWeight)} kg`', "`${formatNum(p.totalWeight)} ${p.measureUnit || 'kg'}`")
          text = text.replace('<th className="py-2.5 pr-3">Berat</th>', '<th className="py-2.5 pr-3">Kuantum Fisik</th>')
          text = text.replace('`${formatNum(item.totalWeight)} kg`', "`${formatNum(item.totalWeight)} ${item.measureUnit || 'kg'}`")
          p.write_text(text, encoding='utf-8')

          # Pengeluaran: choose source document for all linked documents and
          # show mixed physical units without summing kg + liter + pcs.
          one('frontend/src/pages/Pengeluaran.jsx', 'const printDateWib = (value) => {', '''const measureSummary = (items = []) => {\n  const totals = {};\n  items.forEach((item) => { const unit = item.measureUnit || 'kg'; totals[unit] = (totals[unit] || 0) + Number(item.berat || 0); });\n  return Object.entries(totals).filter(([, value]) => Math.abs(value) > 1e-9).map(([unit, value]) => `${formatNum(value)} ${unit}`).join(' + ') || '—';\n};\n\nconst printDateWib = (value) => {''')
          sub('frontend/src/pages/Pengeluaran.jsx', r'  const remainingQty = \(load, source\) => \{.*?(?=  const updateDocumentItem)', '''  const sourceDocumentFor = (load, item) => item.documentNo || load.ref || '';\n  const linkedUsageFor = (load, sourceDocumentNo, productId) => (load.document_links || []).reduce((total, link) => {\n    const linkSource = link.sourceDocumentNo || load.ref || '';\n    if (linkSource !== sourceDocumentNo) return total;\n    return total + (link.items || []).filter((item) => item.productId === productId).reduce((sum, item) => sum + (['CR', 'RETUR'].includes(link.type) ? Number(item.goodQty || 0) + Number(item.damagedQty || 0) : Number(item.qty || 0)), 0);\n  }, 0);\n  const sourceItemsFor = (load, sourceDocumentNo) => {\n    const grouped = {};\n    (load.items || []).filter((item) => sourceDocumentFor(load, item) === sourceDocumentNo).forEach((item) => { grouped[item.productId] = grouped[item.productId] || { ...item, qty: 0, documentNo: sourceDocumentNo }; grouped[item.productId].qty += Number(item.qty || 0); });\n    return Object.values(grouped);\n  };\n  const remainingQty = (load, source, sourceDocumentNo = sourceDocumentFor(load, source)) => Math.max(Number(source.qty || 0) - linkedUsageFor(load, sourceDocumentNo, source.productId), 0);\n  const consignmentSummary = Object.values(outboundLoads.filter((load) => ['MEMO', 'ND'].includes(load.document_type) && load.consignment_destination && load.status === 'Selesai').reduce((result, load) => {\n    (load.documents || [load.ref]).forEach((sourceDocumentNo) => sourceItemsFor(load, sourceDocumentNo).forEach((item) => {\n      const qty = remainingQty(load, item, sourceDocumentNo);\n      if (qty <= 0) return;\n      const key = `${load.consignment_destination}|${load.consignment_zone || 'Unit 18'}|${item.productId}|${item.channel || ''}`;\n      result[key] = result[key] || { destination: load.consignment_destination, zone: load.consignment_zone || 'Unit 18', name: item.name, unit: item.unit, qty: 0 };\n      result[key].qty += qty;\n    }));\n    return result;\n  }, {}));\n  const isReturnMode = (mode) => ['CR', 'RETUR', 'SO_RETUR'].includes(mode);\n  const salesReturnRemaining = (load, item, sourceDocumentNo) => {\n    const returned = (load.document_links || []).filter((link) => link.type === 'SO_RETUR' && link.sourceDocumentNo === sourceDocumentNo).reduce((total, link) => total + (link.items || []).filter((entry) => entry.productId === item.productId).reduce((sum, entry) => sum + Number(entry.goodQty || 0) + Number(entry.damagedQty || 0), 0), 0);\n    return Math.max(Number(item.qty || 0) - returned, 0);\n  };\n  const returnItemsFor = (load, mode, sourceDocumentNo) => sourceItemsFor(load, sourceDocumentNo).map((item) => {\n    const remaining = mode === 'SO_RETUR' ? salesReturnRemaining(load, item, sourceDocumentNo) : remainingQty(load, item, sourceDocumentNo);\n    return { productId: item.productId, name: item.name, unit: item.unit, goodQty: 0, stackCode: item.location || '', placements: [{ goodQty: 0, stackCode: item.location || '' }], damagedQty: 0, remaining };\n  });\n  const openLinkedDocument = (load, mode) => {\n    const documents = load.documents || [load.ref];\n    const sourceDocumentNo = documents[0] || '';\n    const sourceItems = sourceItemsFor(load, sourceDocumentNo);\n    setDocumentModal({ load, mode, documentNo: '', note: '', sourceDocumentNo, items: isReturnMode(mode) ? returnItemsFor(load, mode, sourceDocumentNo) : sourceItems.map((item) => ({ productId: item.productId, name: item.name, unit: item.unit, qty: remainingQty(load, item, sourceDocumentNo), remaining: remainingQty(load, item, sourceDocumentNo) })) });\n  };\n''')
          p = Path('frontend/src/pages/Pengeluaran.jsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('const payload = { documentNo: documentModal.documentNo, note: documentModal.note, returnType: documentModal.mode, items:', 'const payload = { documentNo: documentModal.documentNo, sourceDocumentNo: documentModal.sourceDocumentNo, note: documentModal.note, returnType: documentModal.mode, items:')
          text = text.replace("documentModal.mode === 'SO_RETUR' && <div><label className=\"text-sm block mb-1\">SO asal</label>", "(documentModal.load.documents || [documentModal.load.ref]).length > 1 && <div><label className=\"text-sm block mb-1\">Dokumen sumber</label>")
          text = text.replace("returnItemsFor(documentModal.load, 'SO_RETUR', sourceDocumentNo)", "returnItemsFor(documentModal.load, documentModal.mode, sourceDocumentNo)")
          text = text.replace('${escapeHtml(formatNum(load.total_berat || 0))} Kg', '${escapeHtml(measureSummary(load.items || []))}')
          text = text.replace('<div class="k">Tonase:</div>', '<div class="k">Kuantum Fisik:</div>')
          text = text.replace('<td class="right">${escapeHtml(formatNum(item.berat || 0))}</td>', '<td class="right">${escapeHtml(formatNum(item.berat || 0))} ${escapeHtml(item.measureUnit || \'kg\')}</td>')
          text = text.replace('<th>Berat (kg)</th>', '<th>Kuantum Fisik</th>')
          text = text.replace('<td class="right"><b>${escapeHtml(formatNum(sj.berat || 0))}</b></td>', '<td class="right"><b>${escapeHtml(measureSummary(sj.items || []))}</b></td>')
          text = text.replace("const row = grouped[groupKey] || { name: item.name || '-', qty: 0, berat: 0, secondary: item.secondary || 'karung', secondaryQty: Number(item.secondaryQty || 0), amount: 0, overtime: 0 };", "const row = grouped[groupKey] || { name: item.name || '-', unit: item.unit || 'pcs/pack', measureUnit: item.measureUnit || 'kg', qty: 0, berat: 0, secondary: item.secondary || 'karung', secondaryQty: Number(item.secondaryQty || 0), amount: 0, overtime: 0 };")
          text = text.replace("<span className=\"text-[#6b7688]\">({formatNum(item.berat || 0)} kg)</span>", "<span className=\"text-[#6b7688]\">({formatNum(item.berat || 0)} {item.measureUnit || 'kg'})</span>")
          p.write_text(text, encoding='utf-8')

          # Regression tests.
          p = Path('backend/tests/test_unit_safety.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from backend.outbound_flow import loading_units_from_items\nfrom fastapi import HTTPException', 'from backend.outbound_flow import loading_units_from_items, _linked_totals, _source_product_totals, _all_source_documents_settled\nfrom backend.stack_allocations import _parse_treatment_date\nfrom fastapi import HTTPException')
          text += '''\n\ndef test_linked_documents_are_scoped_to_source_document():\n    load = {"ref": "ND/001", "documents": ["ND/001", "ND/002"], "items": [{"productId": "p1", "documentNo": "ND/001", "qty": 10}, {"productId": "p1", "documentNo": "ND/002", "qty": 20}], "document_links": [{"type": "SO", "sourceDocumentNo": "ND/001", "items": [{"productId": "p1", "qty": 4}]}, {"type": "SO", "sourceDocumentNo": "ND/002", "items": [{"productId": "p1", "qty": 7}]}]}\n    assert _linked_totals(load, "p1", "ND/001") == (0.0, 4.0)\n    assert _linked_totals(load, "p1", "ND/002") == (0.0, 7.0)\n    assert _source_product_totals(load, "ND/001")["p1"]["qty"] == 10\n    assert _all_source_documents_settled(load) is False\n\n\ndef test_treatment_date_parser_rejects_invalid_dates():\n    assert _parse_treatment_date("2026-09-16", "Tanggal").isoformat() == "2026-09-16"\n    with pytest.raises(HTTPException, match="YYYY-MM-DD"):\n        _parse_treatment_date("16/09/2026", "Tanggal")\n'''
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install backend dependencies and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m py_compile backend/server.py backend/inventory_flow.py backend/master_products.py backend/outbound_flow.py backend/consignment.py backend/stack_allocations.py backend/pdf_documents.py app.py
          pytest -q backend/tests/test_unit_safety.py

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install --network-timeout 600000
          CI=false yarn build

      - name: Commit correctness and unit fixes
        shell: bash
        run: |
          git config user.name "inventory-audit-bot"
          git config user.email "inventory-audit-bot@users.noreply.github.com"
          rm -f frontend/yarn.lock
          git add backend/consignment.py backend/outbound_flow.py backend/stack_allocations.py backend/pdf_documents.py backend/tests/test_unit_safety.py frontend/src/pages/DaftarProduk.jsx frontend/src/pages/Dashboard.jsx frontend/src/pages/Pengeluaran.jsx
          git diff --cached --check
          git commit -m "fix: scope consignment units and pest treatments"
          git push origin HEAD:dev-testing
