name: Temporary Production Probe
on:
  push:
    branches: [main]
    paths: [.vercel-probe-trigger]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production
        shell: bash
        run: |
          set +e
          BASE="https://management-inventory-v1-gsuntertimur1-5309.vercel.app"
          for path in "/" "/api/"; do
            echo "===== $path ====="
            curl -sS -L -D /tmp/h -o /tmp/b -w "HTTP=%{http_code} FINAL=%{url_effective}\n" "$BASE$path"
            echo "--- headers ---"
            cat /tmp/h
            echo "--- body-first-1200 ---"
            head -c 1200 /tmp/b
            echo
          done
